services:
  now-workbench:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: now-workbench
    ports:
      # Loopback only: cloudflared (same host) is the way in, never the LAN.
      - "127.0.0.1:8080:8080"
    environment:
      - WORKBENCH_HOST=0.0.0.0
      - WORKBENCH_PORT=8080
      # Cloudflare Access (ADR-016). The container refuses to start without the first two.
      - WORKBENCH_ACCESS_TEAM_DOMAIN=${WORKBENCH_ACCESS_TEAM_DOMAIN:-}
      - WORKBENCH_ACCESS_AUDIENCE=${WORKBENCH_ACCESS_AUDIENCE:-}
      - WORKBENCH_ADMIN_EMAILS=${WORKBENCH_ADMIN_EMAILS:-}
      - WORKBENCH_CONSULTANT_EMAILS=${WORKBENCH_CONSULTANT_EMAILS:-}
      - WORKBENCH_SN_INSTANCE_URL=${WORKBENCH_SN_INSTANCE_URL:-}
      - WORKBENCH_SN_USERNAME=${WORKBENCH_SN_USERNAME:-}
      - WORKBENCH_SN_PASSWORD=${WORKBENCH_SN_PASSWORD:-}
      - WORKBENCH_ANTHROPIC_API_KEY=${WORKBENCH_ANTHROPIC_API_KEY:-${ANTHROPIC_API_KEY:-}}
      - WORKBENCH_CLAUDE_MODEL=claude-sonnet-5-5
      # AES-256-GCM master key (ADR-012): kept OUT of ./data so a copied DB alone is useless.
      - WORKBENCH_KEY_FILE=/run/workbench-keys/master.key
    volumes:
      - ./bundles:/app/bundles
      - ./workspaces:/app/workspaces
      - ./data:/app/data
      - workbench-keys:/run/workbench-keys
    restart: unless-stopped

  # Optional named tunnel (same pattern as the rivian gateway). Skip it when the host already
  # runs cloudflared: add a public hostname there that points to http://localhost:8080.
  #     docker compose --profile tunnel up -d
  cloudflared:
    profiles: ["tunnel"]
    image: cloudflare/cloudflared:latest
    container_name: cloudflared-now-workbench
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    network_mode: host
    environment:
      - TUNNEL_TOKEN=${CLOUDFLARE_TUNNEL_TOKEN:-}

volumes:
  workbench-keys:
