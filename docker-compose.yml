# docker-compose.yml
# now-workbench on srv01chambly, isolated from the homelab (ADR-016, ADR-017).
#
#   cp .env.example .env    # then paste the tunnel token (the only secret)
#   docker compose up -d --build
#   docker logs now-workbench   # FIRST-RUN SETUP CODE
#
# Reach: Cloudflare Access (app "Now Workbench", policy "Now Workbench users") -> tunnel
# "workbench" -> the cloudflared container below -> now-workbench, over a private network.
# No port is published on the host. The Claude key and instance passwords are entered in the
# UI and stored encrypted; the master key is generated into its own volume.
services:
  now-workbench:
    build:
      context: .
      dockerfile: Dockerfile
    image: now-workbench:latest
    container_name: now-workbench
    restart: unless-stopped
    labels:
      # Locally built image: watchtower must never replace it with a registry pull.
      - com.centurylinklabs.watchtower.enable=false
    networks:
      - workbench-net
    # Public resolvers: the host's LAN resolver is behind the private-range firewall rules.
    dns:
      - 1.1.1.1
      - 1.0.0.1
    environment:
      # Refuse to start without them (the app also refuses to listen without Access).
      - WORKBENCH_ACCESS_TEAM_DOMAIN=${WORKBENCH_ACCESS_TEAM_DOMAIN:?set WORKBENCH_ACCESS_TEAM_DOMAIN in .env}
      - WORKBENCH_ACCESS_AUDIENCE=${WORKBENCH_ACCESS_AUDIENCE:?set WORKBENCH_ACCESS_AUDIENCE in .env}
      - WORKBENCH_CLAUDE_MODEL=${WORKBENCH_CLAUDE_MODEL:-claude-sonnet-5-5}
      # Optional: the shared Claude key. When set it wins over a key entered in the UI.
      - WORKBENCH_ANTHROPIC_API_KEY=${WORKBENCH_ANTHROPIC_API_KEY:-}
    volumes:
      # The database and the master key are in separate volumes: a copy of one is useless
      # without the other. Back them up separately (see docs/deploy.md).
      - workbench-data:/app/data
      - workbench-keys:/run/workbench-keys
      - workbench-bundles:/app/bundles
      - workbench-workspaces:/app/workspaces
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    # Bounded resources: a runaway browser or SDK build cannot starve the host.
    mem_limit: 2g
    pids_limit: 512
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # Dedicated tunnel: this stack never shares the homelab tunnel or its connector.
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: now-workbench-tunnel
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    networks:
      - workbench-net
    # Public resolvers: the host's LAN resolver is behind the private-range firewall rules.
    dns:
      - 1.1.1.1
      - 1.0.0.1
    environment:
      # Not required here so the workbench can start (and be checked) before the token is
      # pasted; cloudflared itself refuses to run without it.
      - TUNNEL_TOKEN=${CLOUDFLARE_TUNNEL_TOKEN:-}
    depends_on:
      - now-workbench
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 256m
    pids_limit: 128
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"

networks:
  # A named bridge so host firewall rules can block it from the LAN (docs/deploy.md).
  workbench-net:
    driver: bridge
    driver_opts:
      com.docker.network.bridge.name: br-workbench
    ipam:
      config:
        - subnet: 10.89.0.0/24

volumes:
  workbench-data:
  workbench-keys:
  workbench-bundles:
  workbench-workspaces:
