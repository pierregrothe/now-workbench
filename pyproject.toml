[tool.poetry]
name = "now-workbench"
version = "0.1.0"
description = "AI-native containerized developer & demonstration workbench for ServiceNow SDK"
authors = ["Pierre Grothe <pierre@grothe.ca>"]
readme = "README.md"
packages = [{include = "now_workbench", from = "src"}]

[tool.poetry.dependencies]
python = "^3.12"
fastapi = ">=0.115.0"
uvicorn = {extras = ["standard"], version = ">=0.32.0"}
typer = {extras = ["all"], version = ">=0.13.0"}
rich = ">=13.9.0"
pydantic = ">=2.9.0"
pydantic-settings = ">=2.6.0"
httpx = ">=0.28.0"
anthropic = ">=0.40.0"
pyyaml = ">=6.0.2"

[tool.poetry.group.dev.dependencies]
pytest = ">=8.3.0"
pytest-asyncio = ">=0.24.0"
pytest-cov = ">=5.0.0"
ruff = ">=0.8.0"
mypy = ">=1.13.0"
black = ">=24.10.0"

[tool.poetry.scripts]
workbench = "now_workbench.cli:app"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP"]
ignore = []

[tool.black]
line-length = 100
target-version = ["py312"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_ignores = true
disallow_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
