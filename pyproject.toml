[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "now-workbench"
version = "0.1.0"
description = "AI-native developer & demonstration workbench for ServiceNow SDK"
authors = [{ name = "Pierre Grothe", email = "pierre@grothe.ca" }]
readme = "README.md"
requires-python = ">=3.14.10"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "typer>=0.13.0",
    "rich>=13.9.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "httpx>=0.28.0",
    "anthropic>=0.40.0",
    "pyyaml>=6.0.2",
    "cryptography>=46",
    "pyjwt[crypto]>=2.15.1",
]

[project.scripts]
workbench = "now_workbench.interfaces.cli.main:app"

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.8.0",
    "mypy>=1.13.0",
    "black>=24.10.0",
    "pre-commit>=4.7.0",
    "import-linter>=2.16",
]

[tool.uv]
default-groups = ["dev"]

[tool.hatch.build.targets.wheel]
packages = ["src/now_workbench"]

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "C901", "PLR0913"]
ignore = []

# ADR-015: cyclomatic complexity <= 10 and at most 6 arguments per function in src/.
[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.pylint]
max-args = 6

[tool.ruff.lint.per-file-ignores]
# The limits govern application code, as the ratchet they replace did; tests are exempt.
"tests/**" = ["C901", "PLR0913"]
# Typer maps every command-line option to one function parameter.
"src/now_workbench/interfaces/cli/**" = ["PLR0913"]

[tool.black]
line-length = 100
target-version = ["py314"]

[tool.mypy]
python_version = "3.14"
strict = true
warn_return_any = true
warn_unused_ignores = true
disallow_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
