# .pre-commit-config.yaml
# Governance & Ratchet enforcement for now-workbench (ADR-005)
# Author: Pierre Grothe
# Date: 2026-10-29

default_install_hook_types: [pre-commit, commit-msg, pre-push]

repos:
  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: v3.6.0
    hooks:
      - id: conventional-pre-commit
        stages: [commit-msg]
        args: [--strict, feat, fix, refactor, perf, docs, style, test, chore, ci, build, revert]

  - repo: local
    hooks:
      - id: ruff
        name: Ruff Lint Check
        entry: python .claude/hooks/_venv_run.py ruff check src/ tests/
        language: system
        types: [python]
        pass_filenames: false
        always_run: true
        stages: [pre-commit]

      - id: ruff-format
        name: Ruff Format Check
        entry: python .claude/hooks/_venv_run.py ruff format --check src/ tests/
        language: system
        types: [python]
        pass_filenames: false
        always_run: true
        stages: [pre-commit]

      - id: mypy
        name: Mypy Strict Type Check
        entry: python .claude/hooks/_venv_run.py mypy src
        language: system
        types: [python]
        pass_filenames: false
        always_run: true
        stages: [pre-commit]

      - id: web-typecheck
        name: Frontend TypeScript Type Check (ADR-001)
        entry: web/node_modules/.bin/tsc -p web/tsconfig.json --noEmit
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit]

      - id: file-size
        name: File Size Limits (ADR-005)
        entry: python scripts/check_file_sizes.py
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit]

      - id: ratchet-all
        name: Metric Ratchets Check
        entry: python .ratchet/ratchet_check.py all
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit]

      - id: primer-reconcile
        name: Governance Registry Drift Gate
        entry: python .claude/scripts/primer-reconcile.py
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit]

      - id: pytest-pre-push
        name: pytest -- full suite + 100% coverage floor (pre-push)
        entry: python .claude/hooks/_venv_run.py pytest -q --tb=short --cov=src/now_workbench --cov-fail-under=100
        language: system
        types: [python]
        pass_filenames: false
        always_run: true
        stages: [pre-push]

      - id: web-e2e
        name: Playwright end-to-end UI suite (pre-push, ADR-013)
        entry: npm --prefix web run test:e2e
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]
